[project]
name = "vinyl-turntable"
version = "0.1.0"
description = "A parametric belt-drive turntable modelled in build123d, viewable in the browser"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
    "pygltflib>=1.16",
]

[project.scripts]
export = "scripts.export_model:main"
watch = "scripts.watch:main"
verify = "scripts.verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turntable", "scripts"]

[tool.uv]
package = true

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
